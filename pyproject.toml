[project]
name = "fc666"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "redis>=5,<7",
    "httpx>=0.28,<1",
    "websockets>=15,<17",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "httpx>=0.28,<1",
    "playwright>=1.50,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
