name: fc666-test
x-app: &app
  image: fc666-test-backend:products-strategies-20261015
  build:
    context: ..
    dockerfile: Dockerfile.backend
  restart: unless-stopped
  env_file: ../.env.backend
  init: true
  mem_limit: 768m
  cpus: 0.75
  pids_limit: 128
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  postgres:
    image: registry-1.docker.io/timescale/timescaledb@sha256:18d486ab4aa441636f007b24da25dddf02a59524b9f391b9b60ac85a4667f339
    restart: unless-stopped
    env_file: ../.env.backend
    environment: {POSTGRES_USER: fc666, POSTGRES_DB: fc666, TS_TUNE_MEMORY: 512MB, TS_TUNE_NUM_CPUS: "1"}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50", "-c", "work_mem=4MB"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fc666 -d fc666"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: registry-1.docker.io/library/redis@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    <<: *app
    image: fc666-test-backend:matrix-20261016
    ports: ["127.0.0.1:18666:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=6)"]
      interval: 20s
      timeout: 8s
      retries: 3
  market:
    <<: *app
    command: ["python", "-m", "apps.worker.market"]
  research:
    <<: *app
    image: fc666-test-backend:matrix-20261016
    command: ["python", "-m", "apps.worker.research"]
  paper:
    <<: *app
    command: ["python", "-m", "apps.worker.paper"]
volumes:
  postgres-data:
