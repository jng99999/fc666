name: Operator and pinned model SDKs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIVE_TRADING: "false"
      LANGSMITH_TRACING: "false"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: infrastructure/tradingagents-worker-lock.txt
      - name: Install the worker's pinned SDK environment
        run: python -m pip install -r infrastructure/tradingagents-worker-lock.txt
      - name: Verify authentication and actual SDK transports without external model calls
        run: |
          python -m pytest -q tests/test_operator_settings.py tests/test_operator_runtime.py tests/test_provider_transport.py tests/test_tradingagents_worker.py --junitxml=operator-sdk-results.xml
          python - <<'PY'
          from xml.etree import ElementTree
          root = ElementTree.parse('operator-sdk-results.xml').getroot()
          assert sum(int(suite.get('skipped', 0)) for suite in root.iter('testsuite')) == 0, 'Pinned worker verification must not skip SDK cases'
          PY
