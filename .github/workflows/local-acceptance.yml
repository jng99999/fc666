name: Local acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install frozen dependencies
        run: |
          uv sync --frozen
          npm ci --prefix apps/web
          python scripts/local_config.py
      - name: Start isolated storage
        run: docker compose --env-file .env -f infrastructure/compose.yaml up -d --wait
      - name: Database head and full acceptance
        run: |
          uv run --frozen alembic upgrade head
          bash scripts/check.sh
          uv run --frozen python -m scripts.backup_drill
      - name: Stop isolated storage
        if: always()
        run: docker compose --env-file .env -f infrastructure/compose.yaml down
