name: Isolated PPO research checks
on:
  workflow_dispatch:
  push:
    paths: ['core/gold/rl.py', 'scripts/study_gold_ppo.py', 'tests/test_gold_rl.py', 'requirements-rl.txt', '.github/workflows/ppo-research.yml']
  pull_request:
    paths: ['core/gold/rl.py', 'scripts/study_gold_ppo.py', 'tests/test_gold_rl.py', 'requirements-rl.txt', '.github/workflows/ppo-research.yml']
permissions:
  contents: read
jobs:
  ppo-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-rl.txt
      - name: Install isolated CPU research dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-rl.txt
      - name: Causality, accounting, model export and admission checks
        run: python -m pytest tests/test_gold_rl.py -q
